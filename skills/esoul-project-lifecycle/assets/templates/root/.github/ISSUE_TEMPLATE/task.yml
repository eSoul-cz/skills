name: Task
description: A new feature, a change, a refactoring or data work
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Write the title as `Context: Action result` (for example `Cart: Recalculate shipping after a
        quantity change`) and **use the same title for the paired Freelo task** (a new project has
        English titles; an existing Czech project keeps its Czech tracker titles). No category prefix
        and no slice ID in the title. Express the category (`frontend`, `backend`, `data-migration`,
        `infrastructure`, `documentation`, optionally `integration`) with a label.

  - type: input
    id: header
    attributes:
      label: Slice
      description: >-
        Header line: the slice ID from `docs/plan/seznam-slices.md`, the phase with its gate and the
        size. Write `mimo plán` for work outside the plan.
      value: "**Slice:** F?-?? · **Fáze:** F? (brána G?) · **Rozsah:** S"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What should happen and why, where the request came from.
      placeholder: |
        Where it came from (meeting, podklad, review, production defect), which problem it solves
        and what happens if it is not done.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Affected areas
      description: >-
        Verified file paths, classes, modules, routes, tables. **Write only what you verified in the
        repository**: a false path costs the assignee more time than an empty field.
    validations:
      required: false

  - type: textarea
    id: changes
    attributes:
      label: What is needed
      description: A numbered list of concrete changes.
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this task deliberately does not do and where it belongs (another slice, another issue).
      placeholder: |
        - …
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Technical, observable conditions of done, verified by the developer. When the task changes
        or introduces a calculation, name the source in `docs/podklady/` (file, sheet, cell or
        column) that the result must reproduce.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: uat
    attributes:
      label: UAT
      description: >-
        UAT is not the same as the acceptance criteria. **UAT is a scenario that a non-technical
        person clicks through in the application** and can answer yes or no at the end. State the
        dimensions from `CONTEXT.md` (Project profile) with concrete values. Each step is a user
        action plus the expected result after the arrow. No SQL, no commands, no reading logs. For
        technical work write `**Role:** vývojář eSoul`, or explicitly „Bez uživatelsky viditelného
        dopadu“, and describe a technical check with an observable result.
      value: |
        **Role:**
        **Předpoklad:**
        {{UAT_DIMENSION_LINES}}

        1. [ ] User action → expected result.
        2. [ ] … → …
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Implementation notes
      description: Constraints, pitfalls, what to watch out for, what deliberately not to do.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >-
        Record a blocking issue as a native GitHub dependency (`blocked_by`); it is the source of
        truth and the Freelo relation mirrors it. Write here only an overview and a dependency on a
        `proposed` ADR or an open question (an issue labelled `question`).
      placeholder: |
        - Blocked by: #…
        - Open question: #…
    validations:
      required: false

  - type: textarea
    id: links
    attributes:
      label: Links
      description: ADR, plan and slice, design (file and frame), podklady.
      placeholder: |
        - ADR: docs/adr/NNNN-….md
        - Plan: docs/plan/seznam-slices.md (F?-??)
        - Design: docs/design_pencil/… (frame …)
        - Podklady: docs/podklady/…
    validations:
      required: false

  - type: input
    id: freelo
    attributes:
      label: Freelo
      description: URL of the paired task. Fill it in as soon as the task exists.
      placeholder: https://app.freelo.io/task/…
    validations:
      required: false

  - type: checkboxes
    id: contract
    attributes:
      label: Contract check
      options:
        - label: >-
            The terms used match `GLOSSARY.md`, or adding to the glossary is part of the task.
          required: false
        - label: >-
            The task does not contradict an `accepted` ADR, or the contradiction is described and a
            new ADR is to be written.
          required: false
        - label: >-
            The task does not depend on an open question or a `proposed` ADR, or it says so
            explicitly.
          required: false
