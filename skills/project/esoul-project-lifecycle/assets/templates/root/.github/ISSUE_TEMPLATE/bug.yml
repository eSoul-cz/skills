name: Bug
description: Something does not work as it should
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write the title as `Context: Action result`, the same title as the paired Freelo task (in a
        new project it is English; an existing Czech project keeps its Czech titles). Express the
        category (`frontend`, `backend`, `data-migration`, `infrastructure`) with a label, not a
        prefix. No real client data (names, contacts, amounts from the podklady); an anonymised
        sample of the faulty records is allowed.

  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What actually happens. The error message verbatim; a screenshot is welcome.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: >-
        What should have happened instead, and why you think so. For numbers, say where the correct
        value comes from: a source in `docs/podklady/`, an ADR or a manual recalculation.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: >-
        The difference between a crooked alignment and a wrong amount is an order of magnitude.
        Severity (the review scale, also used by UAT bug reports): Blocks a key flow, Distorted
        data and Exposes personal or foreign data are Critical; Functional limitation is Major
        when a main flow is affected, otherwise Minor; Cosmetic is Nitpick.
      options:
        - Blocks a key flow (the user cannot finish the main action)
        - Distorted data, amounts or documents
        - Exposes personal or foreign data
        - Functional limitation (a workaround exists)
        - Cosmetic
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local
        - staging / preview
        - production
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role
      description: >-
        The role under which the bug is visible (a role from `GLOSSARY.md`), or `not signed in`, or
        `across roles`.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Affected areas
      description: Verified file paths, classes, routes, tables, if you know them.
    validations:
      required: false

  - type: textarea
    id: uat
    attributes:
      label: UAT
      description: >-
        Steps that prove after the fix that the bug is gone, including the original reproduction.
        A non-technical person clicks through them; use the dimensions from `CONTEXT.md` with
        concrete values.
      value: |
        **Role:**
        **Předpoklad:**
        {{UAT_DIMENSION_LINES}}

        1. [ ] User action → expected result.
    validations:
      required: true

  - type: input
    id: freelo
    attributes:
      label: Freelo
      description: URL of the paired task. Fill it in as soon as the task exists.
      placeholder: https://app.freelo.io/task/…
    validations:
      required: false
